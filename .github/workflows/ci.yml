name: CI

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python files
        run: python -m py_compile custom_components/co2_carbonator/*.py
      - name: Validate JSON files
        run: python -m json.tool custom_components/co2_carbonator/manifest.json >/dev/null && python -m json.tool custom_components/co2_carbonator/strings.json >/dev/null && python -m json.tool hacs.json >/dev/null
